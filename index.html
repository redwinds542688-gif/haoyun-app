四、成效紀錄：自追蹤起點的下一期開始，不回填。排行推薦看三期內開出（未滿三期為觀察中）；關聯推薦看同期中幾顆，與同顆數隨機期望比較。

==================== 資料來源：爬蟲與資料讀取（2026-10-09 整理） ====================
一、整條資料流
  [開獎網站 ×8 來源/彩券] → 爬蟲 lottery_scraper.py（公開 repo：Lottery-scraper，GitHub Actions 執行）
    → 寫入 data.json（私人 repo：Lottery-database，用金鑰 DATA_TOKEN 寫入）
    → Cloudflare 閘道 lottery-data-gate（workers.dev，帶 key 才能讀；私人 repo 不能直接公開讀）
    → 本 App 的 sync() 讀取 → 合併進 DATA → 重新計算推薦／偏移／成效紀錄。
  2026-10-09 起爬蟲搬到公開 repo（私人 repo 的 Actions 每月 2,000 分鐘額度用完，10/7 起停擺）；
  資料仍在私人 repo，App 這邊讀取方式完全不變。

二、爬蟲排程（台灣時間，每彩券一天主要觸發一次＋一次備援，觸發後程式內部自己重試）
  今彩539 21:00（備援 21:30）／大樂透 21:05（備援 22:00）／
  香港六合彩 22:00（備援 22:15）／加州天天樂 隔天 11:05（備援 11:45）。
  手動補跑：Lottery-scraper → Actions → 選彩券 → Run workflow（同一彩券不要連按兩次）。

三、爬蟲確認號碼的規則（摘要，完整說明在 lottery_scraper.py 開頭）
  1. 任一來源日期＝台灣今天且號碼是新的 → 可單一來源確認；但「Google新聞搜尋」不能單獨確認。
  2. 否則至少 2 個來源號碼完全一致（且日期吻合）才確認。
  3. 大樂透／六合彩特別號須在 1~49 且不可與正式號碼重複（2026-10-06 大樂透錯誤資料後加入）。
  4. 同彩券同號碼不重複寫入；draw_date 一律存台灣日期 YYYY-MM-DD。

四、data.json 格式（App 讀取的欄位）
  { "今彩539":[最新,…], "大樂透":[…], "香港六合彩":[…], "加州天天樂":[…] }
  每筆：draw_date（日期）、numbers（空白分隔號碼）、special_number（特別號，539/天天樂為空）、
        period、agreeing_sources、checked_at（App 只在 draw_date 無法解析時拿 checked_at 當備用）。
  App 內代號對照（CNAME）：今彩539→539、香港六合彩→mark6、加州天天樂→daily、大樂透→lotto。

五、App 讀取與合併規則（sync / mergeRows）
  1. 何時讀：開啟 0.2 秒後、切回畫面（visibilitychange）、每 10 分鐘（setInterval 600000）。逾時 10 秒放棄。
  2. 日期：normalizeCrawlerDate() 把各種格式轉成 YYYY-MM-DD；天天樂若是舊式美國日期字串
     （如 "WED/OCT 08"）自動 +1 天換成台灣日期。
  3. 只收「比 App 最後一期更新」的資料；遇到不新的就停止往下看（資料是最新在前）。
  4. 檢查：號碼個數要對（539/天天樂 5 顆、六合彩/大樂透 6 顆）、範圍要對（1~39／1~49），
     且不能與最近 6 期任何一期號碼完全相同（防重複／錯誤資料），不合格的跳過。
  5. 合併：依日期排序後接在 DATA 後面；有新增就 reinit() 重算全部畫面。
  6. 記憶：比內建資料新的期數存在手機 localStorage（haoyun_extra_v1），下次打開先合併，沒網路也能用。
  7. 讀不到（沒網路、閘道錯誤、claude.ai 預覽）：沿用手機裡的資料或內建資料，畫面照常顯示。
     SYNC_NOTE 會記錄狀態：「雲端同步 月/日 時:分」／「雲端回應 xxx」／「讀不到雲端」／「使用內建資料」。

六、內建資料（DATA）
  程式裡內建一份完整歷史（每筆 [日期, [號碼…], 特別號]），作為離線底稿；
  更新內建資料時從 data.json 轉入即可，雲端同步只補內建之後的新期數。

七、故障時怎麼辦
  - App 某彩券沒更新 → 先看 Lottery-scraper 的 Actions 當天有沒有紅叉；
    爬蟲正常但 App 沒更新 → 關掉 App 重開（或下拉重新整理）。
  - 爬蟲故障時可人工補登：在 Lottery-database 的 data.json 對應彩券陣列最前面加一筆
    （agreeing_sources 寫「使用者人工補登」），App 下次同步就會讀到。
  - 號碼錯了 → 修正 data.json 後，手機裡已存的錯誤期數需清除 App 的網站資料（localStorage）才會換掉。
